# MeraLawyer.pk — Nginx (same rules as site/.htaccess)
# Certbot adds the HTTPS server block and the HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name meralawyer.pk www.meralawyer.pk;

    root /var/www/meralawyer.pk/current/site;
    index index.html;

    # www -> non-www
    if ($host = www.meralawyer.pk) {
        return 301 https://meralawyer.pk$request_uri;
    }

    autoindex off;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/plain application/xml image/svg+xml application/ld+json application/manifest+json;

    location / {
        # Folder URLs get a trailing slash (nginx adds it via 301), then index.html
        try_files $uri $uri/ =404;
        expires 1h;
    }

    location ~* \.(css|js|png|svg|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Never serve Apache files or dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
